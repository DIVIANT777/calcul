<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор дохода врача PRO</title>
<style>
body {font-family: Arial, sans-serif; background:#f4f6f9; margin:0; padding:20px;}
.container {max-width:1100px; margin:auto; background:#fff; padding:20px; border-radius:14px; box-shadow:0 5px 25px rgba(0,0,0,0.08);}
h1 {text-align:center;}
.section {margin-bottom:25px;}
input, button {padding:8px; margin:4px 0; border-radius:8px; border:1px solid #ccc;}
button {cursor:pointer; background:#2e7d32; color:white; border:none;}
button:hover {opacity:0.9;}
.service, .expense {background:#f9fafc; padding:10px; border-radius:10px; margin-bottom:10px;}
.result {background:#e8f5e9; padding:15px; border-radius:12px; font-size:18px;}
label {font-size:14px;}
.row {display:flex; gap:10px; flex-wrap:wrap;}
.small {width:120px;}
</style>
</head>
<body>
<div class="container">
<h1>Калькулятор дохода врача PRO</h1>

<div class="section">
<h3>Рабочее время</h3>
<div class="row">
<input type="number" id="hours" placeholder="Часов в день">
<input type="number" id="days" placeholder="Дней в месяц">
<input type="number" id="breakTime" placeholder="Перерыв (мин/день)">
</div>
</div>

<div class="section">
<h3>Услуги</h3>
<div id="services"></div>
<button onclick="addService()">+ Добавить услугу</button>
</div>

<div class="section">
<h3>Расходы</h3>
<div id="expenses"></div>
<button onclick="addExpense()">+ Добавить расход</button>
</div>

<div class="section result">
<div>Валовый доход: <span id="gross">0</span> ₽</div>
<div>Доход врача (после % клиники): <span id="netDoctor">0</span> ₽</div>
<div>Расходы: <span id="totalExpenses">0</span> ₽</div>
<div><strong>Чистый доход: <span id="finalIncome">0</span> ₽</strong></div>
</div>

</div>

<script>

function addService(name="", duration="", price="", clinicPercent="50"){
const div = document.createElement("div");
div.className = "service";
div.innerHTML = `
<div class="row">
<input placeholder="Название" value="${name}">
<input type="number" class="small" placeholder="Длительность (мин)" value="${duration}">
<input type="number" class="small" placeholder="Цена" value="${price}">
<input type="number" class="small clinicPercent" placeholder="% клиники" value="${clinicPercent}">
<button onclick="this.parentElement.parentElement.remove(); calculate()">Удалить</button>
</div>
`;
document.getElementById("services").appendChild(div);
attachEvents(div);
}

function addExpense(category="", amount=""){
const div = document.createElement("div");
div.className = "expense";
div.innerHTML = `
<div class="row">
<input placeholder="Категория" value="${category}">
<input type="number" class="small expenseAmount" placeholder="Сумма" value="${amount}">
<button onclick="this.parentElement.parentElement.remove(); calculate()">Удалить</button>
</div>
`;
document.getElementById("expenses").appendChild(div);
attachEvents(div);
}

function attachEvents(element){
element.querySelectorAll("input").forEach(input=>{
input.addEventListener("input", calculate);
});
}

document.querySelectorAll("input").forEach(input=>{
input.addEventListener("input", calculate);
});

function calculate(){
const hours = Number(document.getElementById("hours").value)||0;
const days = Number(document.getElementById("days").value)||0;
const breakTime = Number(document.getElementById("breakTime").value)||0;

const totalMinutesPerDay = hours*60 - breakTime;
const totalMinutesMonth = totalMinutesPerDay * days;

let gross=0;
let doctorIncome=0;

document.querySelectorAll(".service").forEach(service=>{
const inputs = service.querySelectorAll("input");
const duration = Number(inputs[1].value)||0;
const price = Number(inputs[2].value)||0;
const clinicPercent = Number(inputs[3].value)||0;

if(duration>0){
const count = Math.floor(totalMinutesMonth / duration);
const serviceGross = count * price;
gross += serviceGross;

const doctorShare = serviceGross * ((100 - clinicPercent)/100);
doctorIncome += doctorShare;
}
});

let totalExpenses=0;
document.querySelectorAll(".expenseAmount").forEach(exp=>{
totalExpenses += Number(exp.value)||0;
});

const finalIncome = doctorIncome - totalExpenses;

document.getElementById("gross").innerText = gross.toLocaleString();
document.getElementById("netDoctor").innerText = doctorIncome.toLocaleString();
document.getElementById("totalExpenses").innerText = totalExpenses.toLocaleString();
document.getElementById("finalIncome").innerText = finalIncome.toLocaleString();
}

addService();
calculate();

</script>
</body>
</html>
